<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Une petite surprise...</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fdfbf7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        #message-top {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 60px;
            text-align: center;
            padding: 0 20px;
            transition: opacity 0.5s ease;
            font-style: italic;
        }

        .gift-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .gift-container.idle {
            animation: breathe 2s infinite ease-in-out;
        }

        .box-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 140px;
            background-color: #1a2a40;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .box-bottom::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 100%;
            background-color: #d4af37;
        }

        .monogram {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: #d4af37;
            font-family: 'Georgia', serif;
            font-size: 22px;
            font-style: italic;
            font-weight: bold;
            z-index: 6;
            letter-spacing: 2px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.4);
        }

        .box-lid {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 176px;
            height: 40px;
            background-color: #1a2a40;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 4;
            transition: transform 0.1s ease;
        }
        .box-lid::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 100%;
            background-color: #d4af37;
        }

        .bow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            z-index: 5;
        }
        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border: 6px solid #d4af37;
            border-radius: 50%;
            top: -12px;
        }
        .bow::before { left: -26px; }
        .bow::after { right: -12px; }

        @keyframes shake {
            0% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-4px) rotate(-3deg); }
            50% { transform: translateX(4px) rotate(3deg); }
            75% { transform: translateX(-4px) rotate(-3deg); }
            100% { transform: translateX(0) rotate(0); }
        }
        .shake-anim {
            animation: shake 0.2s ease-in-out;
        }

        @keyframes compress {
            0% { transform: translate(-50%, 0) scaleY(1); }
            100% { transform: translate(-50%, 5px) scaleY(0.9); }
        }
        .compress-anim .box-lid {
            animation: compress 0.1s forwards;
        }

        .surprise-content {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 110px;
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }

        .gift-container.open .box-lid {
            transform: translate(-50%, -180px) rotate(25deg);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease 0.2s;
        }
        .gift-container.open .bow {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .gift-container.open .surprise-content {
            transform: translateX(-50%) translateY(-130px) scale(1);
        }

        #message-bottom {
            margin-top: 60px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #2c3e50;
            min-height: 48px;
            text-align: center;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>

    <div id="message-top">J'ai un petit truc pour toi... Tapote pour l'ouvrir !</div>

    <div class="gift-container idle" id="gift">
        <div class="surprise-content" id="finger">🖕</div>
        <div class="box-lid" id="lid">
            <div class="bow"></div>
        </div>
        <div class="box-bottom">
        </div>
    </div>

    <div id="message-bottom"></div>

    <script>
        const gift = document.getElementById('gift');
        const messageTop = document.getElementById('message-top');
        const messageBottom = document.getElementById('message-bottom');
        const lid = document.getElementById('lid');
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        
        let clickCount = 0;
        const clicksNeeded = 7;
        const finalMessage = "Je t'ai bien eu !";

        // Moteur de confettis autonome (sans librairie externe)
        function launchConfetti(originX, originY) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const colors = ['#d4af37', '#1a2a40', '#e74c3c', '#f39c12', '#2ecc71'];
            const particles = [];

            for (let i = 0; i < 130; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 14 + 5;
                particles.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(angle) * speed * (0.7 + Math.random() * 0.6),
                    vy: Math.sin(angle) * speed - 9,
                    size: Math.random() * 8 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: (Math.random() - 0.5) * 14
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let active = false;

                for (const p of particles) {
                    p.vy += 0.42;      // Gravité
                    p.vx *= 0.985;     // Résistance de l'air
                    p.vy *= 0.985;
                    p.x += p.vx;
                    p.y += p.vy;
                    p.rotation += p.rotationSpeed;

                    if (p.y < canvas.height + 20) {
                        active = true;
                        ctx.save();
                        ctx.translate(p.x, p.y);
                        ctx.rotate((p.rotation * Math.PI) / 180);
                        // Effet de papier qui tournoie en 3D
                        ctx.scale(1, Math.cos((p.rotation * Math.PI) / 180));
                        ctx.fillStyle = p.color;
                        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                        ctx.restore();
                    }
                }

                if (active) {
                    requestAnimationFrame(animate);
                }
            }

            animate();
        }

        gift.addEventListener('click', () => {
            if (clickCount >= clicksNeeded) return;

            clickCount++;

            if (navigator.vibrate) {
                navigator.vibrate(40);
            }

            if (clickCount < clicksNeeded) {
                gift.classList.remove('idle');
                gift.classList.remove('shake-anim');
                void gift.offsetWidth;
                gift.classList.add('shake-anim');
                
                lid.style.transform = `translate(-50%, -${clickCount * 2}px) rotate(${clickCount % 2 === 0 ? 1 : -1}deg)`;
                
                if (clickCount === clicksNeeded - 1) {
                    gift.classList.add('compress-anim');
                }
            } else {
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100, 50, 300]);
                }
                
                gift.classList.remove('idle');
                gift.classList.remove('shake-anim');
                gift.classList.remove('compress-anim');
                gift.classList.add('open');

                const rect = gift.getBoundingClientRect();
                launchConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
                
                messageTop.style.opacity = '0';

                setTimeout(() => {
                    typeWriter(finalMessage, 0);
                }, 50);
            }
        });

        function typeWriter(text, i) {
            if (i < text.length) {
                messageBottom.innerHTML += text.charAt(i);
                i++;
                setTimeout(() => typeWriter(text, i), 70);
            }
        }
    </script>
</body>
</html>
