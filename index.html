<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Une petite surprise...</title>
    <!-- Librairie pour l'explosion de confettis -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #fdfbf7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #message-top {
            font-size: 1.4rem;
            color: #333;
            margin-bottom: 60px;
            text-align: center;
            padding: 0 20px;
            transition: opacity 0.5s ease;
            font-style: italic;
        }

        .gift-container {
            position: relative;
            width: 200px;
            height: 200px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }
        .gift-container.idle {
            animation: breathe 2s infinite ease-in-out;
        }

        .box-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 140px;
            background-color: #1a2a40;
            border-radius: 5px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .box-bottom::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 100%;
            background-color: #d4af37;
        }

        /* Initiales sur la boîte pour rendre le piège crédible */
        .monogram {
            position: absolute;
            bottom: 25px;
            width: 100%;
            text-align: center;
            color: #d4af37;
            font-family: 'Georgia', serif;
            font-size: 22px;
            font-style: italic;
            font-weight: bold;
            z-index: 6;
            letter-spacing: 2px;
            text-shadow: 0px 2px 4px rgba(0,0,0,0.4);
        }

        .box-lid {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 176px;
            height: 40px;
            background-color: #1a2a40;
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 4;
            transition: transform 0.1s ease;
        }
        .box-lid::after {
            content: '';
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 100%;
            background-color: #d4af37;
        }

        .bow {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 20px;
            z-index: 5;
        }
        .bow::before, .bow::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            border: 6px solid #d4af37;
            border-radius: 50%;
            top: -12px;
        }
        .bow::before { left: -26px; }
        .bow::after { right: -12px; }

        @keyframes shake {
            0% { transform: translateX(0) rotate(0); }
            25% { transform: translateX(-4px) rotate(-3deg); }
            50% { transform: translateX(4px) rotate(3deg); }
            75% { transform: translateX(-4px) rotate(-3deg); }
            100% { transform: translateX(0) rotate(0); }
        }
        .shake-anim {
            animation: shake 0.2s ease-in-out;
        }

        /* Animation du couvercle qui s'écrase avant d'exploser */
        @keyframes compress {
            0% { transform: translate(-50%, 0) scaleY(1); }
            100% { transform: translate(-50%, 5px) scaleY(0.9); }
        }
        .compress-anim .box-lid {
            animation: compress 0.1s forwards;
        }

        .surprise-content {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) scale(0);
            font-size: 110px;
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: bottom center;
        }

        /* --- ÉTAT OUVERT --- */
        .gift-container.open .box-lid {
            transform: translate(-50%, -180px) rotate(25deg);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease 0.2s;
        }
        .gift-container.open .bow {
            opacity: 0;
            transition: opacity 0.2s;
        }
        .gift-container.open .surprise-content {
            transform: translateX(-50%) translateY(-130px) scale(1);
        }

        #message-bottom {
            margin-top: 60px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #2c3e50;
            min-height: 48px;
            text-align: center;
            padding: 0 15px;
        }
    </style>
</head>
<body>

    <div id="message-top">J'ai un petit truc pour toi... Tapote pour l'ouvrir !</div>

    <div class="gift-container idle" id="gift">
        <div class="surprise-content" id="finger">🖕</div>
        <div class="box-lid" id="lid">
            <div class="bow"></div>
        </div>
        <div class="box-bottom">
        </div>
    </div>

    <div id="message-bottom"></div>

    <script>
        const gift = document.getElementById('gift');
        const messageTop = document.getElementById('message-top');
        const messageBottom = document.getElementById('message-bottom');
        const lid = document.getElementById('lid');
        
        let clickCount = 0;
        const clicksNeeded = 7; 
        // Tu peux modifier la phrase de chute ici
        const finalMessage = "Je t'ai bien eu !";

        gift.addEventListener('click', (e) => {
            if (clickCount >= clicksNeeded) return;

            clickCount++;

            if (navigator.vibrate) {
                navigator.vibrate(40);
            }

            if (clickCount < clicksNeeded) {
                gift.classList.remove('idle');
                gift.classList.remove('shake-anim');
                void gift.offsetWidth; 
                gift.classList.add('shake-anim');
                
                const baseTransform = -50; 
                lid.style.transform = `translate(${baseTransform}%, -${clickCount * 2}px) rotate(${clickCount % 2 === 0 ? 1 : -1}deg)`;
                
                // Au dernier clic avant ouverture, on simule l'écrasement du ressort
                if (clickCount === clicksNeeded - 1) {
                    gift.classList.add('compress-anim');
                }

            } else {
                // --- OUVERTURE ---
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100, 50, 300]); 
                }
                
                gift.classList.remove('idle');
                gift.classList.remove('shake-anim');
                gift.classList.remove('compress-anim');
                gift.classList.add('open'); 
                
                // Lancement des confettis !
                const rect = gift.getBoundingClientRect();
                const xOrigin = (rect.left + (rect.width / 2)) / window.innerWidth;
                const yOrigin = (rect.top + (rect.height / 2)) / window.innerHeight;

                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { x: xOrigin, y: yOrigin },
                    colors: ['#d4af37', '#1a2a40', '#ffffff', '#ff0000'], // Or, Bleu, Blanc, Rouge
                    zIndex: 1000
                });
                
                messageTop.style.opacity = '0'; 

                setTimeout(() => {
                    typeWriter(finalMessage, 0);
                }, 100);
            }
        });

        function typeWriter(text, i) {
            if (i < text.length) {
                messageBottom.innerHTML += text.charAt(i);
                i++;
                setTimeout(() => typeWriter(text, i), 70); 
            }
        }
    </script>
</body>
</html>
